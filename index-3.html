<!doctype html><html lang="pt-PT"><head>
<meta name="theme-color" content="#38205d">
<meta name="description" content="VibraSer Runas — Sistema de Leitura Rúnica">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibraSer® Runas v1.0</title>
<style>
:root{--p:#38205d;--g:#c6a15b;--bg:#f6f2f8;--ink:#30263a;--line:#e6dced}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}button,input,select{font:inherit}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--p);color:white;cursor:pointer}.gold{background:var(--g);color:#2d2340}.light{background:#eee7f3;color:var(--p)}#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6b4789,#2b1646)}.login{width:400px;max-width:92%;background:white;padding:38px;border-radius:22px;text-align:center}.brand{color:var(--g);letter-spacing:3px;font-weight:bold}.field{margin:12px 0;text-align:left}.field label{display:block;font-size:13px;color:#776e82;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px}.side{position:fixed;top:0;bottom:0;width:245px;background:var(--p);padding:24px 15px;overflow:auto;color:white}.side strong{font-size:20px}.side small{display:block;color:#d9c8e7;letter-spacing:2px;margin:4px 0 22px}.nav{display:grid;gap:8px}.nav button{border:0;border-radius:10px;background:white;color:#30233f;text-align:left;padding:12px;font-weight:bold;cursor:pointer}.main{margin-left:245px;padding:30px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h2{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.card,.section{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;margin-bottom:16px}.metric b{font-size:30px;color:var(--p);display:block}.rune{font-size:48px;color:var(--p)}.pill{display:inline-block;background:#f0e8f5;padding:5px 9px;border-radius:20px;margin:3px;font-size:12px}.reading{font-size:17px;line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.notice{padding:13px;background:#faf5ec;border-left:4px solid var(--g);border-radius:7px}@media(max-width:750px){.side{position:relative;width:100%;height:auto}.main{margin-left:0;padding:18px}}
</style>
<style id="pdf-logo-style">
@media print {
  @page { margin: 18mm 16mm 18mm 16mm; }
  body { background: #fff !important; }
  #login, .side, .top, .actions, button, label.btn { display:none !important; }
  .main { margin:0 !important; padding:0 !important; }
  #content { width:100% !important; }
  .section, .card { box-shadow:none !important; break-inside:avoid; }
  .pdf-header {
    display:flex !important;
    align-items:center;
    gap:18px;
    border-bottom:1px solid #c6a15b;
    padding-bottom:12px;
    margin-bottom:22px;
  }
  .pdf-header img {
    width:78px !important;
    height:78px !important;
    object-fit:contain;
    border-radius:4px;
  }
  .pdf-header .pdf-brand {
    color:#38205d;
    font-size:20px;
    letter-spacing:2px;
    font-weight:bold;
  }
  .pdf-header .pdf-title {
    color:#5b4b67;
    font-size:12px;
    margin-top:4px;
  }
}
.pdf-header { display:none; }
</style>

<style id="runes-editorial-pdf">
#printArea{display:none}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff!important}
 body>*{visibility:hidden!important}
 #printArea,#printArea *{visibility:visible!important}
 #printArea{display:block!important;position:absolute;left:0;top:0;width:100%;background:#fff;color:#302536}
 .runeCover{height:297mm;page-break-after:always;display:flex;flex-direction:column;justify-content:space-between;text-align:center;padding:22mm 20mm 18mm}
 .runeCover .logo{width:155px;height:155px;object-fit:contain;margin:0 auto 18mm;border-radius:24px;background:#000}
 .runeCover .brand{font-family:system-ui,-apple-system,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#76558e;font-weight:700;font-size:12pt}
 .runeCover .title{font-size:30pt;color:#4c355d;font-weight:700;margin:8mm 0 4mm}
 .runeCover .subtitle{font-size:14pt;color:#756b7c}
 .runeCover .client{font-size:21pt;color:#302536;margin-top:18mm}
 .runeCover .date{font-family:system-ui,sans-serif;color:#756b7c;margin-top:4mm}
 .runeCover .bottom{font-family:system-ui,sans-serif;color:#b58a3a;font-size:10pt;letter-spacing:1px}
 .runeReport{padding:16mm 17mm 18mm}
 .runeReport .header{display:flex;align-items:center;gap:12px;border-bottom:2px solid #b58a3a;padding-bottom:9px;margin-bottom:10mm}
 .runeReport .header img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#000}
 .runeReport .brandTitle{font-family:system-ui,sans-serif;font-size:10pt;letter-spacing:2px;color:#76558e;font-weight:700}
 .runeReport .docTitle{font-size:18pt;color:#4c355d}
 .runeReport .client{font-family:system-ui,sans-serif;font-size:10pt;color:#756b7c;margin-bottom:8mm}
 .runeReport .section{border-top:1px solid #ded5e3;padding:7mm 0;break-inside:avoid}
 .runeReport h2{font-size:17pt;color:#76558e;margin:0 0 4mm}
 .runeReport h3{font-size:13pt;color:#4c355d;margin:0 0 2mm}
 .runeReport p{font-size:11pt;line-height:1.7;margin:2mm 0}
 .runeReport .symbol{font-size:28pt;color:#76558e;vertical-align:middle}
 .runeReport .pill{display:inline-block;background:#eee7f1;border-radius:12px;padding:2px 7px;margin:1px 2px;font-family:system-ui,sans-serif;font-size:8.5pt}
 .runeReport .footer{text-align:center;color:#756b7c;font-family:system-ui,sans-serif;font-size:8pt;border-top:1px solid #ddd;padding-top:5mm;margin-top:8mm}
}
</style>

<style id="login-logo-style">
.login-logo{margin-top:28px;padding-top:20px;border-top:1px solid #eee7f0;text-align:center}
.login-logo img{width:86px;height:86px;object-fit:contain;border-radius:12px;background:#000;display:block;margin:0 auto 8px}
.login-logo small{font-family:system-ui,-apple-system,sans-serif;color:#8a7c91;font-size:9px;letter-spacing:1.5px}
</style>

function populateClientSelect(selected=""){

function getPositionCount(){
let s=document.getElementById("spread")?.value||"";
if(s.startsWith("Uma Runa")) return 1;
if(s.includes("Três Runas")) return 3;
if(s.includes("Cinco Runas")) return 5;

}
function positionLabel(i){
let s=document.getElementById("spread")?.value||"";
if(s.startsWith("Uma Runa")) return "Mensagem";
if(s.includes("Situação / Desafio / Direção")) return ["","Situação","Desafio","Direção"][i]||("Posição "+i);
if(s.includes("Passado / Presente / Futuro")) return ["","Passado","Presente","Futuro"][i]||("Posição "+i);
return ["","Centro","Força","Desafio","Conselho","Integração"][i]||("Posição "+i);
}
function updateRunePositions(){
let wrap=document.getElementById("runePositions"); if(!wrap)return;
let count=getPositionCount(),old={};
for(let i=1;i<=5;i++){
 let r=document.getElementById("r"+i),o=document.getElementById("o"+i);
 if(r)old[i]={r:r.value,o:o?o.value:"Direta"};
}
wrap.innerHTML="";
for(let i=1;i<=count;i++){
 let box=document.createElement("div"); box.className="field";
 box.innerHTML=`<label>${positionLabel(i)}</label><select id="r${i}"><option value="">— selecionar runa —</option>${opts()}</select><select id="o${i}"><option>Direta</option><option>Invertida</option></select>`;
 wrap.appendChild(box);
 if(old[i]){
   document.getElementById("r"+i).value=old[i].r;
   document.getElementById("o"+i).value=old[i].o;
 }
}
}

${S.clients.map((x,i)=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.contact||"—")}</td><td><button class="btn light" onclick="selectClientForReading(${i})">Nova leitura</button> <button class="btn light" onclick="deleteClient(${i})">Apagar</button></td></tr>`).join("")}
</table>`:`<div class="notice">Ainda não existem clientes guardados.</div>`}
</div>`
}
function addClient(){
let n=document.getElementById("cn").value.trim();
let t=document.getElementById("ct").value.trim();
if(!n){alert("Indica o nome completo do cliente.");return}
let existing=S.clients.find(x=>x.name.toLowerCase()===n.toLowerCase());
if(existing){
  existing.contact=t;
  alert("O cliente já existia. Os dados foram atualizados.");
}else{
  S.clients.push({id:"CL_"+Date.now(),name:n,contact:t,createdAt:new Date().toISOString()});
}
save();
page("clientes");
}
function deleteClient(i){
if(!confirm("Apagar este cliente? As leituras já guardadas não serão apagadas."))return;
S.clients.splice(i,1);save();page("clientes");
}
function selectClientForReading(i){
page("tiragem");
setTimeout(()=>{populateClientSelect(S.clients[i].name)},50);
}
function biblioteca(){content.innerHTML=head("Biblioteca de Runas","24 runas do Elder Futhark + Runa Branca")+`<div class="grid">${RUNES.map(r=>`<div class="card"><div class="rune">${r.symbol}</div><h3>${esc(r.name)}</h3><small>${esc(r.archetype)}</small><p>${esc(r.theme)}</p><p>${esc(r.essence)}</p><p>${r.keywords.split(", ").map(k=>`<span class="pill">${esc(k)}</span>`).join("")}</p></div>`).join("")}</div>`}
function config(){content.innerHTML=head("Configurações","Backup local")+`<div class="section"><h3>Backup</h3><p>Os clientes e leituras ficam guardados neste navegador através do armazenamento local. Usa o backup para não perder os dados ao trocar de computador ou navegador.</p><button class="btn gold" onclick="backup()">Exportar backup</button> <label class="btn light">Importar backup<input type="file" accept=".json" style="display:none" onchange="restore(this)"></label></div><div class="notice">A Runa Branca é um elemento moderno adicional e não a 25.ª runa histórica do Elder Futhark.</div>`}
function backup(){let b=new Blob([JSON.stringify({app:"VibraSer Runas",version:"1.0",...S},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="VibraSer_Runas_Backup_"+new Date().toISOString().slice(0,10)+".json";a.click()}
function restore(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(confirm("Substituir os dados atuais?")){S={clients:x.clients||[],readings:x.readings||[]};save();page("dash")}}catch(e){alert("Backup inválido.")}};r.readAsText(f)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script><div id="printArea"></div>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((err) => {
      console.warn("Não foi possível registar o modo offline:", err);
    });
  });
}
</script>
